name: Draamateatri piletid

on:
  schedule:
    # Iga 10 minuti tagant 03:00-20:50 UTC. Skript ise jätab vahele kõik,
    # mis jääb väljapoole 6:00-23:00 Tallinna aja järgi (suve- ja talveaeg).
    - cron: "*/10 3-20 * * *"
  workflow_dispatch: {}   # võimaldab käsitsi käivitada

permissions:
  contents: write

concurrency:
  group: piletid
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4

      - name: Kontrolli pileteid
        run: python scraper.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Salvesta seis
        run: |
          git config user.name "piletibot"
          git config user.email "piletibot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Piletiseis $(date -u +%F)"
          git push
